services:
  postgres:
    image: postgres:17

    container_name: atlas-postgres

    restart: always

    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas123
      POSTGRES_DB: atlas_db

    ports:
      - '5432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest

    container_name: atlas-qdrant

    restart: always

    ports:
      - '6333:6333'

    volumes:
      - qdrant_data:/qdrant/storage

  redis:
    image: redis:latest

    container_name: atlas-redis

    restart: always

    ports:
      - '6379:6379'

volumes:
  postgres_data:

  qdrant_data:
